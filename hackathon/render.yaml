services:
  - type: web
    name: carwash-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        value: your-aiven-host.aivencloud.com
      - key: DB_PORT
        value: 12345
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false          # paste your password in Render dashboard
      - key: DB_NAME
        value: defaultdb
      - key: PYTHON_VERSION
        value: 3.11.0services:
